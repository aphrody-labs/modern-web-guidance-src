name: Sync Use Cases

on:
  push:
    branches:
      - main
    paths:
      - 'guides/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'guides/**'
  issues:
    types:
      - opened
      - labeled
      - closed
      - reopened
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry run mode'
        required: true
        default: 'true'
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    if: >-
      github.repository == 'GoogleChrome/modern-web-guidance-src' &&
      (github.event_name != 'issues' || !endsWith(github.actor, '[bot]'))
    concurrency:
      group: guide-sync-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate GitHub App token
        if: ${{ vars.GH_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: read
          permission-contents: read

      - name: Run use case sync script
        run: bun src/ci/sync-use-cases.ts
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'pull_request' && 'true') || 'false' }}

      - name: Sync canonical pipeline tracker issue (#1815)
        run: bun src/ci/sync-pipeline-issue.ts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'pull_request' && 'true') || 'false' }}
